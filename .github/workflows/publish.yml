name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump when run manually"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read
  id-token: write

# Serializes publishes: each merge to main gets its own patch version.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    # Put [skip publish] in the merge commit message to skip (push only;
    # head_commit does not exist on manual dispatch).
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # Merge to main: publish package.json version if fresh,
      # otherwise bump patch over the latest on npm.
      - name: Resolve version (merge to main)
        if: github.event_name == 'push'
        run: |
          PKG=$(node -p "require('./package.json').name")
          CUR=$(node -p "require('./package.json').version")
          PUB=$(npm view "$PKG" version 2>/dev/null || echo "0.0.0")
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parse = (v) => v.match(/^(\d+)\.(\d+)\.(\d+)(.*)$/);
            const mc = parse('$CUR'), mp = parse('$PUB');
            if (!mc) { console.error('Bad version $CUR'); process.exit(1); }
            const cmp = !mp ? 1 : (mc[1] - mp[1] || mc[2] - mp[2] || mc[3] - mp[3]);
            if (cmp > 0 && '$PUB' !== '0.0.0' || '$PUB' === '0.0.0') {
              console.log('Publishing version ' + p.version + ' (not on npm yet or ahead)');
            } else {
              const next = [Number(mp[1]), Number(mp[2]), Number(mp[3]) + 1].join('.') + mp[4];
              p.version = next;
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('Version $CUR already published, bumped to ' + next);
            }
          "

      # Manual trigger: bump patch/minor/major from package.json.
      - name: Bump version (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const m = p.version.match(/^(\d+)\.(\d+)\.(\d+)(.*)$/);
            if (!m) { console.error('Bad version ' + p.version); process.exit(1); }
            let [major, minor, patch] = [m[1], m[2], m[3]].map(Number);
            const bump = '${{ inputs.bump }}';
            if (bump === 'major') { major += 1; minor = 0; patch = 0; }
            else if (bump === 'minor') { minor += 1; patch = 0; }
            else { patch += 1; }
            p.version = major + '.' + minor + '.' + patch + m[4];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('Publishing version ' + p.version);
          "

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Publish
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
