name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump when run manually"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read
  id-token: write

# No concurrency group on purpose: publishes run async/independent,
# never queue sync behind each other. No `needs:` on CI either —
# this workflow does its own quick verify then publishes.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # Release trigger: version = git tag (v1.2.3 -> 1.2.3).
      # Tag is the source of truth; package.json is synced to it.
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is not semver (expected vX.Y.Z)"; exit 1
          fi
          npm pkg set version="$TAG"
          echo "Publishing version $TAG"

      # Manual trigger: bump patch/minor/major from package.json.
      - name: Bump version (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const m = p.version.match(/^(\d+)\.(\d+)\.(\d+)(.*)$/);
            if (!m) { console.error('Bad version ' + p.version); process.exit(1); }
            let [major, minor, patch] = [m[1], m[2], m[3]].map(Number);
            const bump = '${{ inputs.bump }}';
            if (bump === 'major') { major += 1; minor = 0; patch = 0; }
            else if (bump === 'minor') { minor += 1; patch = 0; }
            else { patch += 1; }
            p.version = major + '.' + minor + '.' + patch + m[4];
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('Publishing version ' + p.version);
          "

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Publish
        run: pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
